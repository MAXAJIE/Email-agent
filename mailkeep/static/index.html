<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailkeep</title>
<style>
  /* Chat layout follows asdfg/property-agent-ui phase 2 (Conversation.tsx):
     avatar rows, a thinking bubble, an "action required" card for approvals,
     retries on 5xx, and a locked composer while a turn runs. No build step. */
  :root {
    --bg: #0f1115; --surface: #171a21; --raised: #1f232c; --border: #2a2f3a;
    --fg: #e7e9ee; --muted: #8b93a3; --primary: #e0a458; --primary-fg: #1a1206;
    --primary-soft: rgba(224,164,88,.12);
    --ok: #5fbf8f; --danger: #e5675f; --danger-soft: rgba(229,103,95,.10); --radius: 14px;
    --font: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); }
  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; max-width: 980px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .logo { font-weight: 700; } .logo span { color: var(--primary); }
  .chip { font: 12px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
  .chip.ok { color: var(--ok); border-color: rgba(95,191,143,.4); }
  .spacer { flex: 1; }
  button { font: inherit; border-radius: 10px; border: 1px solid var(--border); background: var(--raised); color: var(--fg); padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  svg.i { width: 16px; height: 16px; flex: none; }
  main { overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }
  .turn { display: flex; gap: 10px; align-items: flex-end; max-width: 92%; animation: rise .18s ease-out; }
  .turn.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--raised); border: 1px solid var(--border); color: var(--primary); }
  .turn.user .avatar { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
  .msg { padding: 10px 14px; border-radius: var(--radius); white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  .turn.user .msg { background: var(--primary); color: var(--primary-fg); border-bottom-right-radius: 4px; }
  .turn.bot .msg { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .turn.bot .msg.error { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 13px; white-space: normal; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.id { font: 11px var(--mono); color: var(--muted); }
  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  .elapsed { font: 12px var(--mono); color: var(--muted); margin-left: 8px; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .action { align-self: stretch; background: var(--primary-soft); border: 1px solid var(--primary); border-radius: var(--radius); padding: 14px 16px; }
  .action h3 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--primary); display: flex; align-items: center; gap: 6px; }
  .action .q { white-space: pre-wrap; }
  .action.done { opacity: .6; border-style: dashed; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  footer { padding: 12px 20px 20px; border-top: 1px solid var(--border); }
  form { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); font: inherit; }
  textarea:focus { outline: none; border-color: var(--primary); }
  textarea:disabled { opacity: .6; }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .suggest button { font-size: 12px; padding: 4px 10px; border-radius: 999px; color: var(--muted); }
  .lock { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .setup { margin: auto; max-width: 620px; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .setup h2 { margin-top: 0; }
  .setup textarea { width: 100%; height: 120px; margin: 8px 0; font: 12px var(--mono); }
  .autherr { border: 1px solid var(--danger); background: var(--danger-soft); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
  .autherr b { color: var(--danger); }
  .autherr ol { margin: 8px 0 0; padding-left: 20px; }
  code { font-family: var(--mono); background: var(--raised); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  a { color: var(--primary); }
  .muted { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">mail<span>keep</span></div>
    <div id="account" class="chip">not connected</div>
    <div id="mode" class="chip" hidden></div>
    <div class="spacer"></div>
    <button id="clear" hidden>Clear</button>
    <button id="logout" class="danger" hidden>Disconnect</button>
  </header>
  <main id="log" aria-live="polite"></main>
  <footer id="composer" hidden>
    <div class="suggest" id="suggest"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Ask about your mail, e.g. triage my unread mail"></textarea>
      <button class="primary" id="send" type="submit" aria-label="Send"></button>
    </form>
    <div class="lock" id="lock" hidden></div>
  </footer>
</div>
<script>
const TOKEN = "__TOKEN__";
const $ = (id) => document.getElementById(id);
const log = $("log");
let busy = false, pendingApproval = false, lastStatus = {};

const ICONS = {
  bot: '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
};
function icon(name) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round" })) s.setAttribute(k, v);
  s.classList.add("i"); s.innerHTML = ICONS[name]; return s;   // static markup only, never mail content
}
$("send").append(icon("send"));

async function api(path, body) {
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(path, {
      method: body === undefined ? "GET" : "POST", signal: controller.signal,
      headers: { "Content-Type": "application/json", "X-Mailkeep-Token": TOKEN },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const data = await res.json();
    if (!data || typeof data !== "object") throw new Error("Invalid response from Mailkeep");
    if (!res.ok) { const e = new Error(data.error || res.statusText); e.status = res.status; throw e; }
    return data;
  } catch (e) {
    if (e.name === "AbortError") throw new Error("Connection timed out. The request was not replayed.");
    throw e;
  } finally { clearTimeout(timer); }
}
async function chatRequest(text) {
  const request_id = crypto.randomUUID();
  let submitted;
  // Safe retries use the SAME request ID; the server never runs it twice.
  for (let attempt = 0; attempt < 3; attempt++) {
    try { submitted = await api("/api/chat", { text, request_id }); break; }
    catch (e) { if (e.status && e.status < 500 || attempt === 2) throw e; }
  }
  const stop = el("button", "", "Stop"); stop.type = "button";
  stop.onclick = async () => {
    stop.disabled = true;
    try { await api("/api/cancel", { job_id: submitted.job_id }); }
    catch (e) { stop.disabled = false; addBot({ text: e.message }, true); }
  };
  $("lock").append(stop);
  const started = Date.now();
  try {
    while (Date.now() - started < 3600000) {
      let status;
      try { status = await api("/api/jobs/" + encodeURIComponent(submitted.job_id)); }
      catch (e) {
        if (e.status && e.status < 500) throw e;
        await new Promise(r => setTimeout(r, 1000)); continue;
      }
      if (status.state === "completed") return status.outcome;
      if (status.state === "failed") throw new Error(status.error);
      if (status.state !== "running") throw new Error("Invalid task response");
      await new Promise(r => setTimeout(r, 300));
    }
    await api("/api/cancel", { job_id: submitted.job_id });
    throw new Error("Task deadline reached; cancellation requested.");
  } finally { stop.remove(); }
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;   // textContent only: no HTML injection from mail
  return n;
}
const scroll = () => { log.scrollTop = log.scrollHeight; };

function turn(who, body) {
  const t = el("div", "turn " + who), a = el("div", "avatar");
  a.append(icon(who === "user" ? "user" : "bot"));
  t.append(a, body); log.append(t); scroll(); return t;
}
function addUser(text) { turn("user", el("div", "msg", text)); }
function addBot(m, isError) {
  const box = el("div", "msg" + (isError ? " error" : ""));
  if (m.text) box.append(document.createTextNode(m.text));
  if (m.table) {
    const wrap = el("div", "tablewrap"), t = el("table"), head = el("tr");
    m.table.columns.forEach((c) => head.append(el("th", "", c)));
    t.append(head);
    m.table.rows.forEach((r) => {
      const tr = el("tr");
      r.forEach((v, i) => tr.append(el("td", m.table.columns[i] === "ID" ? "id" : "", v)));
      t.append(tr);
    });
    wrap.append(t); box.append(wrap);
  }
  if (m.hint) box.append(el("div", "hint", m.hint.replace(/Answer y[^.]*\./, "Use the buttons below.")));
  turn("bot", box);
}
function thinking() {
  const box = el("div", "msg"), dots = el("span", "dots"), sec = el("span", "elapsed", "");
  dots.append(el("i"), el("i"), el("i")); box.append(dots, sec);
  const t = turn("bot", box), start = Date.now();
  const tick = setInterval(() => { const s = Math.round((Date.now() - start) / 1000); if (s >= 3) sec.textContent = s + "s"; }, 1000);
  return { set: (txt) => { sec.textContent = txt; }, done: () => { clearInterval(tick); t.remove(); } };
}
function addApproval(a) {
  pendingApproval = true; lockComposer();
  const card = el("div", "action"), h = el("h3");
  h.append(icon("lock"), document.createTextNode("Action required"));
  card.append(h, el("div", "q", a.question), el("div", "muted", "Nothing has changed in Gmail yet. Mailkeep never sends mail."));
  const row = el("div", "row"), yes = el("button", "primary"), no = el("button");
  yes.append(icon("check"), document.createTextNode("Approve"));
  no.append(icon("x"), document.createTextNode("Cancel"));
  const done = async (approve) => {
    yes.disabled = no.disabled = true;
    const ok = await run(() => api("/api/approve", { id: a.id, approve }));
    if (ok) {
      pendingApproval = false; card.classList.add("done");
      row.replaceWith(el("div", "muted", approve ? "Approval processed." : "Cancelled."));
    } else { yes.disabled = no.disabled = false; }
    lockComposer();
  };
  yes.onclick = () => done(true); no.onclick = () => done(false);
  row.append(yes, no); card.append(row); log.append(card); scroll();
}
function lockComposer() {
  const locked = busy || pendingApproval;
  $("send").disabled = locked; $("input").disabled = locked;
  document.querySelectorAll("#suggest button").forEach((b) => (b.disabled = locked));
  const lock = $("lock"); lock.innerHTML = ""; lock.hidden = !locked;
  if (locked) lock.append(icon("lock"), document.createTextNode(pendingApproval ? "Approve or cancel the request above to continue." : "Mailkeep is working…"));
  else $("input").focus();
}
async function run(call) {
  busy = true; lockComposer(); const t = thinking();
  try {
    const out = await call();
    if (!out || !Array.isArray(out.messages)) throw new Error("Invalid task result");
    out.messages.forEach(m => addBot(m));
    if (out.approval) addApproval(out.approval);
    return true;
  } catch (e) {
    addBot({ text: e.message }, true);
    if (e.status === 409) refresh();
    return false;
  } finally { t.done(); busy = false; lockComposer(); }
}
function autosize() { const i = $("input"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 160) + "px"; }
$("input").oninput = autosize;
$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy || pendingApproval) return;
  $("input").value = ""; autosize(); addUser(text);
  run(() => chatRequest(text));
};
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } };
["find unread emails", "find invoices from last month", "analyze trash", "labels", "help"].forEach((s) => {
  const b = el("button", "", s); b.type = "button";
  b.onclick = () => { if (!busy && !pendingApproval) { $("input").value = s; $("form").requestSubmit(); } };
  $("suggest").append(b);
});
$("clear").onclick = () => { if (!busy && !pendingApproval) { log.innerHTML = ""; greet(lastStatus); } };
$("logout").onclick = async () => {
  if (!confirm("Disconnect Gmail and delete the local token?")) return;
  await api("/api/logout", {}); log.innerHTML = ""; refresh();
};

async function authErrorBox(message) {
  const box = el("div", "autherr");
  box.append(el("b", "", "Google refused the sign-in. "), document.createTextNode(message));
  try {
    const info = await api("/api/oauth-check", {});
    const p = el("p", "muted"), a = el("a", "", "Open its Audience page");
    a.href = info.audience_url; a.target = "_blank"; a.rel = "noopener";
    p.append(document.createTextNode("Your OAuth client belongs to Cloud project number "), el("code", "", info.project_number), document.createTextNode(". "), a);
    const ol = el("ol"); info.steps.forEach((s) => ol.append(el("li", "", s)));
    box.append(p, ol);
    if (!info.login_hint) box.append(el("p", "muted", "Tip: set MAILKEEP_GMAIL_ACCOUNT=you@gmail.com in .openminion/gmail.env so Google pre-selects the test-user account."));
  } catch (e) { /* checklist is best effort */ }
  return box;
}
async function setupScreen(st) {
  log.innerHTML = "";
  const box = el("div", "setup"), err = el("p", "muted");
  box.append(el("h2", "", "Connect your Gmail"));
  if (!st.client_configured) {
    box.append(el("p", "", "Step 1. In Google Cloud Console enable the Gmail API, then Credentials → Create credentials → OAuth client ID → Desktop app → Download JSON. Paste the file contents here. It is stored only on this computer."));
    const ta = el("textarea"); ta.placeholder = '{"installed": {"client_id": "...", "client_secret": "..."}}';
    const save = el("button", "primary", "Save client");
    save.onclick = async () => { try { await api("/api/client", { json: ta.value }); refresh(); } catch (e) { err.textContent = e.message; } };
    box.append(ta, save, err);
  } else {
    box.append(el("p", "", "Step 2. Google will ask you to allow Mailkeep to read, label and trash mail and to create drafts. It cannot send mail. Your token stays on this computer."));
    if (st.client_type === "unknown") {
      box.append(el("p", "", "Which kind of OAuth client did you create? Google Cloud Console → Credentials shows it in the 'Type' column."));
      const pick = el("div", "row");
      for (const [type, label] of [["desktop", "Desktop app"], ["web", "Web application"]]) {
        const b = el("button", type === "desktop" ? "primary" : "", label);
        b.onclick = async () => { try { await api("/api/client-type", { type }); refresh(); } catch (e) { err.textContent = e.message; } };
        pick.append(b);
      }
      box.append(pick, err); log.append(box); return;
    }
    if (st.client_type === "web") {
      const p = el("p", "muted", "Your client is a Web application. Before signing in, add this exact line under Authorized redirect URIs and press Save: ");
      const copy = el("button", "", "Copy");
      copy.onclick = () => navigator.clipboard && navigator.clipboard.writeText(st.redirect_uri);
      p.append(el("code", "", st.redirect_uri), " ", copy); box.append(p);
    }
    if (st.auth_error) box.append(await authErrorBox(st.auth_error));
    else box.append(el("p", "muted", "Before signing in: your Gmail address must be listed under Google Auth Platform → Audience → Test users, otherwise Google answers 'Error 403: access_denied'."));
    const go = el("button", "primary", st.auth_error ? "Try again" : "Sign in with Google");
    go.onclick = async () => {
      const popup = window.open("", "mailkeep-oauth", "width=520,height=720");
      try { const { url } = await api("/api/login", {}); if (popup) popup.location.href = url; else location.href = url; }
      catch (e) { if (popup) popup.close(); err.textContent = e.message; }
    };
    box.append(go, err);
  }
  log.append(box);
}
function greet(st) {
  addBot({ text: "Hi, I'm Mailkeep. I can find mail, label it, audit Trash and write drafts. Almost everything for making email management easier! Every change waits for your approval, and I never send mail.",
           hint: st.mode === "rules" ? "No model configured (" + st.mode_reason + "), so I use the built-in command parser. Type help." : "" });
}
async function refresh() {
  let st;
  try { st = await api("/api/status"); } catch (e) { log.textContent = e.message; return; }
  lastStatus = st;
  $("account").textContent = st.connected ? (st.demo ? "demo mailbox" : st.account) : "not connected";
  $("account").className = "chip" + (st.connected ? " ok" : "");
  $("mode").hidden = !st.mode;
  $("mode").textContent = st.mode === "openminion" ? (st.mode_reason || "OpenMinion agent").replace(" via OpenMinion", "") : "rule parser (" + (st.mode_reason || "no model") + ")";
  $("mode").title = st.mode_reason || "";
  $("logout").hidden = !st.connected || st.demo;
  $("clear").hidden = !st.connected;
  $("composer").hidden = !st.connected;
  if (!st.connected) return setupScreen(st);
  if (!log.querySelector(".turn")) { log.innerHTML = ""; greet(st); }
  lockComposer();
}
window.addEventListener("message", (e) => { if (e.origin === location.origin && e.data === "mailkeep-auth") refresh(); });
window.addEventListener("focus", () => { if ($("composer").hidden) refresh(); });
refresh();
</script>
</body>
</html>
